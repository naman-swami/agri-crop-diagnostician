annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Predict root zone soil water depletion fraction against crop field capacity.
input_schema:
  additionalProperties: false
  properties:
    lookahead_days:
      type: number
    sensor_id:
      type: string
  required:
  - sensor_id
  type: object
name: forecast-drought-stress
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
